; Downstream consumer of the library through PlatformIO's library discovery, which
; is the shape README's "PlatformIO" section documents.
;
; What this fixture is for: PlatformIO has no equivalent of CMake's
; install/export tree to assert on, so the manifest - library.json - is the whole
; contract. Nothing in CI was reading it. library.json names the sources
; (build.srcFilter), the include directory (build.includeDir) and the extra port
; include flags (build.flags), and a consumer that includes ds18b20.h depends on
; every one of those being right. Renaming inc/, adding a source file without
; adding it to srcFilter, or dropping a port flag from build.flags would all
; break a real PlatformIO build and none of it showed up.
;
; `symlink://../../..` points lib_deps at this checkout rather than the registry,
; so the fixture builds the working tree and needs no network and cannot drift
; from the commit under test.
;
; Run it with a real PlatformIO:
;     cd tests/integration/platformio && pio run
; That downloads the ststm32 platform and the STM32Cube framework, which is why
; CI does not do it. What CI runs instead is tests/check_library_manifest.sh,
; which reads library.json and checks that every include directory it names
; exists, every header it advertises is present, every source it lists exists,
; no new source file under src/ is missing from srcFilter, and that this
; consumer compiles using the include set the manifest itself declares.
;
; What that does not catch, stated plainly so the gap is not mistaken for
; coverage: a port include flag removed from build.flags while the consumer
; still compiles without it, and anything about how PlatformIO itself resolves
; the manifest. A redundant flag is harmless for a consumer build, so no
; repo-side check can notice it.
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
lib_deps =
    symlink://../../..
build_flags =
    -DOW_PORT_TARGET_F1
