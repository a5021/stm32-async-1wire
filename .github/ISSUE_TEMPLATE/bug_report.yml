name: Bug Report
description: Report a bug or unexpected behavior in the library (1-Wire layer, DS18B20, DS2431, examples or build)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Before submitting,
        please check the [Troubleshooting](https://github.com/a5021/stm32-async-1wire/blob/main/docs/troubleshooting.md)
        guide — most issues are wiring-related.
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Hardware
      description: Board and device(s) used (e.g. Blue Pill STM32F103C8T6, DS18B20, DS2431)
    validations:
      required: true
  - type: textarea
    id: wiring
    attributes:
      label: Wiring
      description: How are the devices connected (pin, pull-up resistor value, power)?
    validations:
      required: true
  - type: input
    id: clock
    attributes:
      label: Clock configuration
      description: System clock and how it is generated (e.g. F103 HSE 8 MHz + PLL = 72 MHz; H503 HSI 64 MHz; H7 HSE 25 MHz + PLL = 240 MHz)
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: UART diagnostics / output
      description: Any serial output or error messages observed
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps that trigger the issue
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Toolchain version, OS, build command used (make / make debug), and OW_MCU
