name: STM32 Build Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Cache the Arm Toolchain (Version 15.2)
      - name: Cache Arm Toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: /opt/gcc-arm-none-eabi
          # Key updated to 15.2 to avoid conflicts with older cached versions
          key: ${{ runner.os }}-gcc-arm-none-eabi-15.2

      # Step 3: Install Toolchain if not in cache (using .tar.xz format)
      - name: Install Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm-none-eabi
          # Note: Using -xJv flag for XZ compression
          wget -qO- https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz | sudo tar -xJv -C /opt/gcc-arm-none-eabi --strip-components=1

      # Step 4: Add the toolchain binaries to the PATH
      - name: Add Toolchain to PATH
        run: echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      # Step 5: Cache project dependencies (CMSIS headers, SVD)
      - name: Cache Project Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}

      # Step 6: Download dependencies only if cache is missing
      - name: Download Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps

      # Step 7: Run the compilation (all example apps, incl. the low-power one)
      - name: Build Project
        run: |
          make
          make APP=2_device_search
          make APP=3_round_robin
          make APP=4_scan_mode
          make APP=5_commands
          make APP=6_statistics
          make APP=7_low_power
          make APP=7_low_power EXT="-DOW_PORT_LOW_POWER=1"
          # Parasite-power compile-time path: every example calls
          # ds18b20_set_parasite(1) under -DOW_PARASITE_POWER=1.
          make APP=1_basic EXT="-DOW_PARASITE_POWER=1"
          make APP=6_statistics EXT="-DOW_PARASITE_POWER=1"

      # Step 8: Upload build results (ELF, BIN, HEX)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stm32-binaries
          path: |
            build/*.elf
            build/*.bin
            build/*.hex

      - name: Build CMake integration consumers
        run: |
          set -euo pipefail
          toolchain="$GITHUB_WORKSPACE/cmake/arm-none-eabi-gcc.cmake"
          core="$GITHUB_WORKSPACE/CMSIS/core"
          device="$GITHUB_WORKSPACE/CMSIS/device"
          prefix="$RUNNER_TEMP/ow-cmake-prefix"
          cmake -S "$GITHUB_WORKSPACE" -B "$RUNNER_TEMP/ow-package" \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DOW_TARGET=f1 -DOW_FETCH_CMSIS=OFF \
            -DOW_CMSIS_CORE_INCLUDE="$core" -DOW_CMSIS_DEVICE_INCLUDE="$device"
          cmake --build "$RUNNER_TEMP/ow-package" --target install
          for kind in add_subdirectory fetchcontent; do
            cmake -S "$GITHUB_WORKSPACE/tests/integration/cmake/$kind" \
              -B "$RUNNER_TEMP/ow-$kind" \
              -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
              -DOW_SOURCE_DIR="$GITHUB_WORKSPACE" \
              -DOW_CMSIS_CORE_INCLUDE="$core" -DOW_CMSIS_DEVICE_INCLUDE="$device" \
              -DOW_TARGET=f1 -DOW_FETCH_CMSIS=OFF
            cmake --build "$RUNNER_TEMP/ow-$kind"
          done
          cmake -S "$GITHUB_WORKSPACE/tests/integration/cmake/installed" \
            -B "$RUNNER_TEMP/ow-installed" \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DOW_CMSIS_CORE_INCLUDE="$core" -DOW_CMSIS_DEVICE_INCLUDE="$device"
          cmake --build "$RUNNER_TEMP/ow-installed"

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Plain Make consumer
        run: make -C tests/integration/plain-make clean all
      - name: Install PlatformIO
        run: python -m pip install --user platformio
      - name: PlatformIO bluepill consumer
        run: python -m platformio run -d tests/integration/platformio

