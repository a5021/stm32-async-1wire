name: Code Quality

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format (pinned)
        run: pip install clang-format==18.1.8
      - name: Check code formatting
        run: clang-format --dry-run --Werror inc/ds18b20.h inc/app.h src/ds18b20.c src/app.c src/demo.c src/demo2.c src/demo3.c tests/mock/*.h tests/mock/*.c tests/test/*.c

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install host GCC
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Download CMSIS dependencies
        run: make download-deps
      - name: Build and run host tests
        run: make test

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Download CMSIS dependencies
        run: make download-deps
      - name: Run static analysis
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=constVariablePointer --suppress=constParameterPointer --suppress=comparePointers -I. -Iinc -ICMSIS/core -ICMSIS/device -DSTM32F103xB -D__GNUC__ src/ds18b20.c src/app.c src/demo.c src/demo2.c src/demo3.c

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Cache CMSIS dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}
      - name: Download dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps
      - name: Build release (demo)
        run: make
      - name: Build release (demo2)
        run: make APP=demo2
      - name: Build release (demo3)
        run: make APP=demo3
      - name: Build with GCC analyzer
        run: make clean && make all EXT="-fanalyzer"
        continue-on-error: true
