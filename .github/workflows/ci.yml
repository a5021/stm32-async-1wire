name: Code Quality

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format (pinned)
        run: pip install clang-format==18.1.8
      - name: Check code formatting
        # src/ds18b20.c is an amalgamated TU that #includes its four functional
        # parts, so the parts must be linted alongside it.
        run: clang-format --dry-run --Werror inc/ds18b20.h inc/onewire.h inc/ow_config.h inc/ow_stats.h src/ds18b20.c src/ds18b20_resolution.c src/ds18b20_txn.c src/ds18b20_search.c src/ds18b20_measure.c src/onewire.c src/ow_stats.c examples/app/app.c examples/1_basic/main.c examples/2_device_search/main.c examples/3_round_robin/main.c examples/4_scan_mode/main.c examples/5_commands/main.c examples/6_statistics/main.c examples/7_low_power/main.c port/stm32f1/ow_port_f1.h port/stm32f0/ow_port_f0.h port/stm32g0/ow_port_g0.h port/stm32f4/ow_port_f4.h tests/mock/*.h tests/mock/*.c tests/test/*.c

  host-tests:
    strategy:
      fail-fast: false
      matrix:
        backend: [f1, f0, g0, f4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install host GCC
        # The ubuntu-latest image ships a Google Chrome apt source (as a
        # .list or deb822 .sources file) whose metadata occasionally gets a
        # Hash Sum mismatch on the CDN, failing apt-get update for every
        # package install. Drop whatever file references it first — our tools
        # come from the Ubuntu archives only.
        run: sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y gcc
      - name: Download CMSIS dependencies
        # All families up front: the host suites compile against mocks, but
        # keeping every backend's dependency set present lets any matrix cell
        # configure either target without re-downloading.
        run: |
          make download-deps
          make OW_TARGET=f0 download-deps
          make OW_TARGET=g0 download-deps
          make OW_TARGET=f4 download-deps
      # One step for all sixteen configurations: the family comes from the job
      # matrix above, so only the variant list is spelled out here. The opt-in
      # variants rebuild the SAME suite with a feature flag changed -
      # test-lowpower with -DOW_PORT_LOW_POWER=1 (the WFE path: SEVONPEND,
      # ow_long_pending, UIE), test-ndebug with -DNDEBUG -DOW_TEST_PARAM_GUARD
      # (asserts compiled out), test-active with -DOW_DRIVE_ACTIVE=1 (push-pull
      # write) - so they exercise value-style feature flags rather than the
      # #ifdef-style ones.
      #
      # The loop stays inside one step on purpose: the host GCC install and the
      # CMSIS download above are shared by the four variants, and folding the
      # variant into the job matrix instead would repeat both for every
      # combination.
      - name: Build and run the host suites
        run: |
          for variant in test test-lowpower test-ndebug test-active; do
              echo "::group::make $variant-${{ matrix.backend }}"
              make "$variant-${{ matrix.backend }}"
              echo "::endgroup::"
          done
      - name: Compile-check the clock defaults
        # Pins each chips/<part>.mk CHIP_SYSCLK_MHZ to the family default in
        # ow_port.h, which the firmware build otherwise overrides.
        run: make test-clocks-${{ matrix.backend }}

  coverage:
    strategy:
      fail-fast: false
      matrix:
        backend: [f1, f0, g0, f4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install host GCC and lcov
        run: sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y gcc lcov
      - name: Download CMSIS dependencies
        run: |
          make download-deps
          make OW_TARGET=f0 download-deps
          make OW_TARGET=g0 download-deps
          make OW_TARGET=f4 download-deps
      - name: Build and run host tests with coverage
        # COVERAGE=1 adds --coverage (gcov instrumentation) to the host test
        # build. The test executables run from the repository root, so the
        # .gcno/.gcda files land there as well — capture scans the whole
        # checkout and the merge step filters out everything that is not the
        # driver core. `make clean` first guarantees a fresh instrumented
        # build.
        run: |
          make clean
          if [ "${{ matrix.backend }}" = "f0" ]; then
            make test-f0 COVERAGE=1
          elif [ "${{ matrix.backend }}" = "g0" ]; then
            make test-g0 COVERAGE=1
          elif [ "${{ matrix.backend }}" = "f4" ]; then
            make test-f4 COVERAGE=1
          else
            make test COVERAGE=1
          fi
      - name: Build and run low-power tests with coverage
        run: |
          if [ "${{ matrix.backend }}" = "f0" ]; then
            make test-lowpower-f0 COVERAGE=1
          elif [ "${{ matrix.backend }}" = "g0" ]; then
            make test-lowpower-g0 COVERAGE=1
          elif [ "${{ matrix.backend }}" = "f4" ]; then
            make test-lowpower-f4 COVERAGE=1
          else
            make test-lowpower COVERAGE=1
          fi
      - name: Capture coverage trace
        run: lcov --capture --directory . --output-file coverage-${{ matrix.backend }}.info --rc branch_coverage=1
      - name: Upload coverage trace
        uses: actions/upload-artifact@v7
        with:
          name: coverage-traces-${{ matrix.backend }}
          path: coverage-${{ matrix.backend }}.info

  coverage-badge:
    needs: [coverage, api-docs]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # genhtml annotates the merged report with source lines, so the
      # checkout must be present (the trace stores runner workspace paths,
      # which match $GITHUB_WORKSPACE exactly).
      - uses: actions/checkout@v5
      - name: Install lcov
        run: sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y lcov
      - name: Download coverage traces
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-traces-*
          path: traces
      - name: Download API docs
        uses: actions/download-artifact@v7
        with:
          name: api-docs
          path: api-docs
      - name: Merge and filter traces
        # Union of every backend's trace measures the MCU-independent core;
        # port headers (register plumbing per family) stay out of the metric
        # so adding new MCU ports never dilutes the number.
        run: |
          ARGS=""
          for f in traces/*/coverage-*.info; do
            ARGS="$ARGS -a $f"
          done
          lcov $ARGS --output-file union.info --rc branch_coverage=1
          lcov --remove union.info '*/tests/*' '/usr/*' '*/inc/ow_bits.h' '*/port/*' \
                --output-file core.info --rc branch_coverage=1 --ignore-errors unused
          lcov --summary core.info --rc branch_coverage=1 > summary.txt || true
          cat summary.txt
      - name: Generate HTML report and badge SVG
        run: |
          mkdir -p publish/coverage
          genhtml core.info --output-directory publish/coverage \
                 --branch-coverage --title "stm32-async-1wire core coverage"
          python3 - <<'PY'
          import re
          text = open("summary.txt").read()
          m = re.search(r"lines\.+: ([\d.]+)%", text)
          pct = int(round(float(m.group(1))))
          color = "#4c1" if pct >= 90 else "#dfb317" if pct >= 75 else "#cb2431"
          svg = (
              '<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" role="img">'
              '<linearGradient id="g" x2="0" y2="100%">'
              '<stop offset="0" stop-color="#bbb" stop-opacity=".1"/>'
              '<stop offset="1" stop-opacity=".1"/></linearGradient>'
              '<clipPath id="r"><rect width="112" height="20" rx="3" fill="#fff"/></clipPath>'
              f'<g clip-path="url(#r)"><rect width="69" height="20" fill="#555"/>'
              f'<rect x="69" width="43" height="20" fill="{color}"/>'
              '<rect width="112" height="20" fill="url(#g)"/></g>'
              '<g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">'
              '<text x="34.5" y="15">coverage</text>'
              f'<text x="89.5" y="15">{pct}%</text></g></svg>'
          )
          open("publish/coverage-badge.svg", "w").write(svg)
          # The report itself lives under coverage/; give the Pages root a
          # redirecting landing page so the bare URL works.
          open("publish/index.html", "w").write(
              '<!doctype html>\n<html lang="en">\n<head>\n'
              '<meta charset="utf-8">\n'
              '<title>stm32-async-1wire coverage</title>\n'
              '<meta http-equiv="refresh" content="0; url=coverage/">\n'
              '<link rel="canonical" href="coverage/">\n</head>\n<body>\n'
              '<p>Redirecting to the <a href="coverage/">coverage report'
              '&hellip;</a></p>\n</body>\n</html>\n'
          )
          print("badge:", pct, "%")
          PY
      - name: Publish to gh-pages
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          DIR=/tmp/gh-pages
          rm -rf "$DIR"
          if git clone --depth 1 --branch gh-pages "$REPO_URL" "$DIR" 2>/dev/null; then
            cd "$DIR"
            git rm -rq .
          else
            git init -q -b gh-pages "$DIR"
            cd "$DIR"
            git remote add origin "$REPO_URL"
            echo "stm32-async-1wire coverage pages" > .placeholder.md
          fi
          cp -r "$GITHUB_WORKSPACE"/publish/* .
          cp -r "$GITHUB_WORKSPACE"/api-docs api/
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "docs(coverage): refresh report and badge (${GITHUB_SHA::7})" \
              || echo "nothing to commit"
          git push -q origin gh-pages

  api-docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install doxygen
        run: sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate API documentation
        run: doxygen Doxyfile
      - name: Upload API docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/api/

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Download CMSIS dependencies
        run: |
          make download-deps
          make OW_TARGET=f4 download-deps
      - name: Run static analysis (F1)
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=constVariablePointer --suppress=constParameterPointer --suppress=comparePointers --suppress=knownConditionTrueFalse --suppress=unsignedLessThanZero -I. -Iinc -Iexamples/app -ICMSIS/core -ICMSIS/device -DSTM32F103xB -DOW_PORT_TARGET_F1 -D__GNUC__ src/ds18b20.c src/onewire.c src/ow_stats.c examples/app/app.c examples/1_basic/main.c examples/2_device_search/main.c examples/3_round_robin/main.c examples/4_scan_mode/main.c examples/5_commands/main.c examples/6_statistics/main.c examples/7_low_power/main.c
      - name: Run static analysis (F0)
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=constVariablePointer --suppress=constParameterPointer --suppress=comparePointers --suppress=knownConditionTrueFalse --suppress=unsignedLessThanZero -I. -Iinc -Iexamples/app -ICMSIS/core -ICMSIS/device -DSTM32F030x6 -DOW_PORT_TARGET_F0 -D__GNUC__ src/ds18b20.c src/onewire.c src/ow_stats.c examples/app/app.c examples/1_basic/main.c examples/2_device_search/main.c examples/3_round_robin/main.c examples/4_scan_mode/main.c examples/5_commands/main.c examples/6_statistics/main.c examples/7_low_power/main.c
      - name: Run static analysis (G0)
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=constVariablePointer --suppress=constParameterPointer --suppress=comparePointers --suppress=knownConditionTrueFalse --suppress=unsignedLessThanZero -I. -Iinc -Iexamples/app -ICMSIS/core -ICMSIS/device -DSTM32G031xx -DOW_PORT_TARGET_G0 -D__GNUC__ src/ds18b20.c src/onewire.c src/ow_stats.c examples/app/app.c examples/1_basic/main.c examples/2_device_search/main.c examples/3_round_robin/main.c examples/4_scan_mode/main.c examples/5_commands/main.c examples/6_statistics/main.c examples/7_low_power/main.c
      - name: Run static analysis (F4)
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=constVariablePointer --suppress=constParameterPointer --suppress=comparePointers --suppress=knownConditionTrueFalse --suppress=unsignedLessThanZero -I. -Iinc -Iexamples/app -ICMSIS/core -ICMSIS/device -DSTM32F407xx -DOW_PORT_TARGET_F4 -D__GNUC__ src/ds18b20.c src/onewire.c src/ow_stats.c examples/app/app.c examples/1_basic/main.c examples/2_device_search/main.c examples/3_round_robin/main.c examples/4_scan_mode/main.c examples/5_commands/main.c examples/6_statistics/main.c examples/7_low_power/main.c

  part-matrix:
    # Every chips/<part>.mk must name repository files that exist and well-formed
    # scalars, and an unknown family or part must be rejected instead of falling
    # through to the F1 default. Deliberately its own job and not a step in
    # build: it needs neither the ARM toolchain nor the CMSIS download (it only
    # checks repo-side paths and expects make to fail at parse time), so it stays
    # fast, runs even when the build jobs are cached or skipped, and its name
    # says which invariant broke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the part matrix
        run: make test-chips

      - name: Check the host mocks against the real CMSIS headers
        # Without this the mock-vs-CMSIS drift guard only runs locally: the
        # per-family clock check above calls test-clocks-<family>, which builds
        # one object and never reaches test-clocks, where test-mocks hangs.
        # Both belong here - static checks over the repo, not per-family builds.
        run: make test-mocks

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Cache CMSIS dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}
      - name: Download dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          make download-deps
          make OW_TARGET=f4 download-deps
      - name: Build release (1_basic)
        run: make
      - name: Build release (3_round_robin)
        run: make APP=3_round_robin
      - name: Build release (4_scan_mode)
        run: make APP=4_scan_mode
      # Backend-specific register plumbing (e.g. the F0 GPIO BSRR bit naming)
      # only compiles into real firmware here — host suites run against mocks.
      # Smoke-build both backends and both clock branches of app.c so a
      # family-only breakage cannot reach a tag.
      - name: Build release (F0 backend)
        run: make clean && make OW_TARGET=f0
      - name: Build release (F0 backend, 8MHz RC)
        run: make clean && make OW_TARGET=f0 SYSCLK_MHZ=8
      - name: Build release (G0 backend)
        run: make clean && make OW_TARGET=g0
      - name: Build release (G0 backend, 16MHz RC)
        run: make clean && make OW_TARGET=g0 SYSCLK_MHZ=16
      - name: Build release (F4 backend)
        run: make clean && make OW_TARGET=f4
      - name: Build release (F4 backend, 16MHz HSI)
        run: make clean && make OW_TARGET=f4 SYSCLK_MHZ=16
      - name: Build with GCC analyzer
        run: make clean && make all EXT="-fanalyzer"
        continue-on-error: true

  cmake:
    # Smoke-build the CMake library package (and the opt-in examples) on real
    # ARM-flavoured object code, like the Makefile build job, so the CMake
    # path cannot rot the way it did before the CI gate existed. The
    # ds18b20 driver is an amalgamated TU: src/ds18b20.c #includes its four
    # parts, which CMake must not compile alone (HEADER_FILE_ONLY) but whose
    # edits must still retrigger ds18b20.c (GCC depfile). The install/export
    # step additionally verifies the find_package() tree.
    strategy:
      fail-fast: false
      matrix:
        backend: [f1, f0, g0, f4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
      - name: Cache CMSIS FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure (OW_TARGET=${{ matrix.backend }})
        # Bare-metal: CMake's default compiler-link check hits missing
        # syscalls in the runtime, so the toolcheck only builds a static
        # archive (CMAKE_TRY_COMPILE_TARGET_TYPE). The toolchain is on PATH
        # via the action, but CMake must see absolute paths for ar/ranlib —
        # a bare name is recorded verbatim and fails to run.
        run: |
          TC_DIR="$(dirname "$(command -v arm-none-eabi-gcc)")"
          cmake -S . -B build/cmake-${{ matrix.backend }} \
              -DOW_TARGET=${{ matrix.backend }} \
              -DOW_BUILD_EXAMPLES=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DCMAKE_C_COMPILER="$TC_DIR/arm-none-eabi-gcc" \
              -DCMAKE_ASM_COMPILER="$TC_DIR/arm-none-eabi-gcc" \
              -DCMAKE_AR="$TC_DIR/arm-none-eabi-ar" \
              -DCMAKE_RANLIB="$TC_DIR/arm-none-eabi-ranlib" \
              -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build/_deps"
      - name: Build (OW_TARGET=${{ matrix.backend }})
        run: cmake --build build/cmake-${{ matrix.backend }} -- -j"$(nproc)"
      - name: Verify install/export tree (OW_TARGET=${{ matrix.backend }})
        run: |
          cmake --install build/cmake-${{ matrix.backend }} --prefix build/prefix-${{ matrix.backend }}
          test -f build/prefix-${{ matrix.backend }}/lib/libstm32_async_1wire.a
          test -f build/prefix-${{ matrix.backend }}/lib/cmake/stm32_async_1wire/stm32_async_1wireConfig.cmake
          test -f build/prefix-${{ matrix.backend }}/include/stm32-async-1wire/ds18b20.h
          test -f build/prefix-${{ matrix.backend }}/include/stm32-async-1wire/ow_port_f4.h
          # ow_port_f0/f1/g0.h include the shared TIM1/DMA1 core, so a
          # package without it would hand consumers a broken header.
          test -f build/prefix-${{ matrix.backend }}/include/stm32-async-1wire/ow_port_tim_dma.h
      - name: Build the parasite / WFE firmware variants
        # The build above only ever sees the default firmware. These two defines
        # select the configurations the hardware was actually measured in, and
        # the WFE path in particular has no other coverage under CMake - without
        # this step -DOW_PORT_LOW_POWER=1 and -DOW_PARASITE_POWER=1 would
        # silently rot in the CMake build.
        run: |
          TC_DIR="$(dirname "$(command -v arm-none-eabi-gcc)")"
          cmake -S . -B build/cmake-variants-${{ matrix.backend }} \
              -DOW_TARGET=${{ matrix.backend }} \
              -DOW_BUILD_EXAMPLES=ON \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
              -DOW_EXTRA_DEFINES="-DOW_PARASITE_POWER=1;-DOW_PORT_LOW_POWER=1" \
              -DCMAKE_C_COMPILER="$TC_DIR/arm-none-eabi-gcc" \
              -DCMAKE_ASM_COMPILER="$TC_DIR/arm-none-eabi-gcc" \
              -DCMAKE_AR="$TC_DIR/arm-none-eabi-ar" \
              -DCMAKE_RANLIB="$TC_DIR/arm-none-eabi-ranlib"
          cmake --build build/cmake-variants-${{ matrix.backend }} -- -j"$(nproc)"
          # The hex/bin pair is part of what this job is meant to prove.
          test -f build/cmake-variants-${{ matrix.backend }}/examples/7_low_power.hex
          test -f build/cmake-variants-${{ matrix.backend }}/examples/7_low_power.bin

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang
        run: sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f && sudo apt-get update && sudo apt-get install -y clang
      - name: Build and run fuzz harnesses (standalone)
        run: make FUZZ_CC=clang FUZZ_TIME=5 fuzz-all
