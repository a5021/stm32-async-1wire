name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the tagged source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Cache the Arm Toolchain (Version 15.2)
      - name: Cache Arm Toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: /opt/gcc-arm-none-eabi
          key: ${{ runner.os }}-gcc-arm-none-eabi-15.2

      # Step 3: Install Toolchain if not in cache
      - name: Install Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm-none-eabi
          wget -qO- https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz | sudo tar -xJv -C /opt/gcc-arm-none-eabi --strip-components=1
          echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      # Step 4: Cache project dependencies (CMSIS headers, SVD)
      - name: Cache Project Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}

      # Step 5: Download dependencies only if cache is missing
      - name: Download Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps

      # Step 6: Build the 72MHz (HSE+PLL) variant (both example apps)
      - name: Build 72MHz (HSE+PLL)
        run: |
          make
          make APP=demo2

      # Step 7: Stage 72MHz artifacts
      - name: Stage 72MHz Artifacts
        run: |
          mkdir -p dist
          cp build/ds18b20_demo.elf   dist/ds18b20_demo_72mhz.elf
          cp build/ds18b20_demo.hex   dist/ds18b20_demo_72mhz.hex
          cp build/ds18b20_demo.bin   dist/ds18b20_demo_72mhz.bin
          cp build/ds18b20_demo2.elf  dist/ds18b20_demo2_72mhz.elf
          cp build/ds18b20_demo2.hex  dist/ds18b20_demo2_72mhz.hex
          cp build/ds18b20_demo2.bin  dist/ds18b20_demo2_72mhz.bin

      # Step 8: Build the 8MHz (HSI) variant (both example apps)
      - name: Build 8MHz (HSI)
        run: |
          make clean
          make HSI_8MHZ=1
          make APP=demo2 HSI_8MHZ=1

      # Step 9: Stage 8MHz artifacts, license and checksums
      - name: Stage 8MHz Artifacts
        run: |
          cp build/ds18b20_demo.elf   dist/ds18b20_demo_8mhz.elf
          cp build/ds18b20_demo.hex   dist/ds18b20_demo_8mhz.hex
          cp build/ds18b20_demo.bin   dist/ds18b20_demo_8mhz.bin
          cp build/ds18b20_demo2.elf  dist/ds18b20_demo2_8mhz.elf
          cp build/ds18b20_demo2.hex  dist/ds18b20_demo2_8mhz.hex
          cp build/ds18b20_demo2.bin  dist/ds18b20_demo2_8mhz.bin
          cp LICENSE dist/LICENSE
          cd dist && sha256sum * > SHA256SUMS.txt

      # Step 10: Publish the release with notes and artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            # Non-Blocking DS18B20 Driver for STM32F103C8T6

            Bare-metal, register-level DS18B20 temperature sensor driver for the
            STM32F103C8T6 "Blue Pill". 1-Wire timing is handled entirely by TIM1
            and DMA — no interrupts, no software delays, minimal CPU usage.

            ## Download

            | File | Description |
            |------|-------------|
            | `ds18b20_demo_72mhz.bin/.hex` | HSE 8MHz + PLL x9 = 72MHz (default), single sensor |
            | `ds18b20_demo2_72mhz.bin/.hex` | 72MHz, device search + poll every sensor on the bus |
            | `ds18b20_demo_8mhz.bin/.hex` | HSI 8MHz, no external crystal, single sensor |
            | `ds18b20_demo2_8mhz.bin/.hex` | 8MHz, device search + poll every sensor on the bus |
            | `SHA256SUMS.txt` | Integrity checksums |
            | `Source code (.zip/.tar.gz)` | Auto-generated by GitHub |

            ## Highlights

            - **True non-blocking 1-Wire**: TIM1 Output Compare + Input Capture with DMA — a hardware state machine does the timing, the CPU just polls a flag
            - **Zero interrupts**: no NVIC IRQs at all
            - **Pure bare-metal C**: register-level, no HAL/LL, arm-none-eabi-gcc
            - **Accuracy**: 0.1 °C resolution, ±0.5 °C typical, one reading every ~0.76 s
            - **CRC-8 validation** on every 9-byte scratchpad read
            - **Weak callbacks** `ds18b20_busy()` / `ds18b20_complete()`
            - **Two example apps**: `demo` (single sensor) and `demo2` (device search + poll all sensors), each in two build variants: 72 MHz (HSE+PLL) and 8 MHz (HSI) via `make HSI_8MHZ=1`
            - **Tooling**: CI (clang-format, cppcheck, GCC -fanalyzer), VSCode J-Link/ST-Link debug configs, non-blocking UART logging

            ## Getting started

            See the [README](https://github.com/a5021/non-blocking-ds18B20-driver-for-stm32f103c8t6#readme):
            include `ds18b20.h`, call `ds18b20_init()` once, then `ds18b20_poll()` in your main loop.

            ---
            *Full auto-generated changelog below.*
