name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the tagged source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Cache the Arm Toolchain (Version 15.2)
      - name: Cache Arm Toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: /opt/gcc-arm-none-eabi
          key: ${{ runner.os }}-gcc-arm-none-eabi-15.2

      # Step 3: Install Toolchain if not in cache
      - name: Install Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm-none-eabi
          wget -qO- https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz | sudo tar -xJv -C /opt/gcc-arm-none-eabi --strip-components=1

      # Step 3b: Put the toolchain on PATH unconditionally. The cache-hit
      # branch skips Step 3 entirely, so the PATH must be set here regardless
      # of whether the toolchain was just installed or restored from cache.
      - name: Add Toolchain to PATH
        run: echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      # Step 4: Cache project dependencies (CMSIS headers, SVD)
      - name: Cache Project Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}

      # Step 5: Download dependencies only if cache is missing
      - name: Download Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps

      # Step 6: Build the full firmware matrix.
      # One row per published variant: APP | OW_TARGET | SYSCLK_MHZ | output stem.
      # A "-" target means the default (F1); F1 keeps its historical artifact
      # names without the target infix, F0 artifacts carry "_f0_".
      - name: Build Firmware Matrix
        run: |
          set -euo pipefail
          mkdir -p dist
          matrix=(
            "demo|-|-|ds18b20_demo_72mhz"
            "demo2|-|-|ds18b20_demo2_72mhz"
            "demo3|-|-|ds18b20_demo3_72mhz"
            "demo4|-|-|ds18b20_demo4_72mhz"
            "demo|-|8|ds18b20_demo_8mhz"
            "demo2|-|8|ds18b20_demo2_8mhz"
            "demo3|-|8|ds18b20_demo3_8mhz"
            "demo4|-|8|ds18b20_demo4_8mhz"
            "demo|f0|-|ds18b20_demo_f0_48mhz"
            "demo2|f0|-|ds18b20_demo2_f0_48mhz"
            "demo3|f0|-|ds18b20_demo3_f0_48mhz"
            "demo4|f0|-|ds18b20_demo4_f0_48mhz"
            "demo|f0|8|ds18b20_demo_f0_8mhz"
            "demo2|f0|8|ds18b20_demo2_f0_8mhz"
            "demo3|f0|8|ds18b20_demo3_f0_8mhz"
            "demo4|f0|8|ds18b20_demo4_f0_8mhz"
            "demo|g0|-|ds18b20_demo_g0_64mhz"
            "demo2|g0|-|ds18b20_demo2_g0_64mhz"
            "demo3|g0|-|ds18b20_demo3_g0_64mhz"
            "demo4|g0|-|ds18b20_demo4_g0_64mhz"
            "demo|g0|16|ds18b20_demo_g0_16mhz"
            "demo2|g0|16|ds18b20_demo2_g0_16mhz"
            "demo3|g0|16|ds18b20_demo3_g0_16mhz"
            "demo4|g0|16|ds18b20_demo4_g0_16mhz"
          )
          for row in "${matrix[@]}"; do
            IFS='|' read -r app target sysclk out <<< "$row"
            flags=""
            [ "$target" != "-" ] && flags="$flags OW_TARGET=$target"
            [ "$sysclk" != "-" ] && flags="$flags SYSCLK_MHZ=$sysclk"
            echo "::group::build $out (APP=$app OW_TARGET=$target SYSCLK_MHZ=$sysclk)"
            make clean
            make APP=$app $flags
            for ext in elf hex bin; do
              cp "build/ds18b20_$app.$ext" "dist/$out.$ext"
            done
            echo "::endgroup::"
          done

      # Step 7: Stage license and checksums over all variants
      - name: Stage License and Checksums
        run: |
          cp LICENSE dist/LICENSE
          cd dist && sha256sum * > SHA256SUMS.txt

      # Step 10: Publish the release with notes and artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            # stm32-async-1wire

            Non-blocking 1-Wire master for STM32 with a DS18B20 temperature driver
            built on top — bare-metal, register-level.
            1-Wire timing is handled entirely by TIM1 and DMA — no interrupts,
            no software delays, minimal CPU usage. One MCU-independent core,
            two header-only backends selected at build time with
            `make OW_TARGET=f0`.

            ## Download

            Each example ships as `.bin` / `.hex` / `.elf` (see `SHA256SUMS.txt`
            for integrity checksums):

            | Target | Clock | Artifact stems |
            |--------|-------|----------------|
            | STM32F103C8T6 | 72MHz (HSE+PLL, default) | `ds18b20_demo_72mhz`, `ds18b20_demo2_72mhz`, `ds18b20_demo3_72mhz`, `ds18b20_demo4_72mhz` |
            | STM32F103C8T6 | 8MHz HSI (no crystal) | `ds18b20_demo_8mhz`, …`demo2_8mhz`, …`demo3_8mhz`, …`demo4_8mhz` |
            | STM32F030x6 | 48MHz (HSI+PLL, default) | `ds18b20_demo_f0_48mhz`, …`demo2_f0_48mhz`, …`demo3_f0_48mhz`, …`demo4_f0_48mhz` |
            | STM32F030x6 | 8MHz HSI | `ds18b20_demo_f0_8mhz`, …`demo2_f0_8mhz`, …`demo3_f0_8mhz`, …`demo4_f0_8mhz` |
            | STM32G031x6 | 64MHz (HSI16+PLL, default) | `ds18b20_demo_g0_64mhz`, …`demo2_g0_64mhz`, …`demo3_g0_64mhz`, …`demo4_g0_64mhz` |
            | STM32G031x6 | 16MHz HSI16 (bus on PA12 pad via remap) | `ds18b20_demo_g0_16mhz`, …`demo2_g0_16mhz`, …`demo3_g0_16mhz`, …`demo4_g0_16mhz` |

            Examples: `demo` — single sensor via Skip ROM; `demo2` — device
            search + round-robin polling of every sensor; `demo3` — device
            search + simultaneous multi-device conversion; `demo4` — device
            search + command transactions (power supply, scratchpad, TH/TL,
            Copy/Recall EEPROM, Read ROM).

            ## Highlights

            - **True non-blocking 1-Wire**: TIM1 Output Compare + Input Capture with DMA — a hardware state machine does the timing, the CPU just polls a flag
            - **Zero interrupts**: no NVIC IRQs at all
            - **Pure bare-metal C**: register-level, no HAL/LL, arm-none-eabi-gcc
            - **Two MCU backends**: STM32F1 (bus on PA8) and STM32F0 (bus on PA10), one shared core
            - **Accuracy**: 0.1 °C resolution, ±0.5 °C typical, one reading every ~0.76 s
            - **CRC-8 validation** on every 9-byte scratchpad read
            - **Weak callbacks** `ds18b20_busy()` / `ds18b20_complete()`
            - **Tooling**: CI (clang-format, cppcheck, GCC -fanalyzer), host test suite for both backends (`make test`, `make test-f0`), VSCode J-Link/ST-Link debug configs

            ## Getting started

            See the [README](https://github.com/a5021/stm32-async-1wire#readme):
            include `ds18b20.h`, call `ds18b20_init()` once, then `ds18b20_poll()` in your main loop.

            ---
            *Full auto-generated changelog below.*
