name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the tagged source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Cache the Arm Toolchain (Version 15.2)
      - name: Cache Arm Toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: /opt/gcc-arm-none-eabi
          key: ${{ runner.os }}-gcc-arm-none-eabi-15.2

      # Step 3: Install Toolchain if not in cache
      - name: Install Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm-none-eabi
          wget -qO- https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz | sudo tar -xJv -C /opt/gcc-arm-none-eabi --strip-components=1

      # Step 3b: Put the toolchain on PATH unconditionally. The cache-hit
      # branch skips Step 3 entirely, so the PATH must be set here regardless
      # of whether the toolchain was just installed or restored from cache.
      - name: Add Toolchain to PATH
        run: echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      # Step 4: Cache project dependencies (CMSIS headers, SVD)
      - name: Cache Project Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}

      # Step 5: Download dependencies only if cache is missing
      - name: Download Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps

      # Step 6: Build the full firmware matrix.
      # One row per published variant: APP | OW_MCU | SYSCLK_MHZ | output stem | EXT
      # A "-" MCU means the default (F1); F1 keeps its historical artifact
      # names without the target infix, other families carry "_<target>_". An
      # empty EXT builds the default configuration; "lowpower" adds
      # -DOW_PORT_LOW_POWER=1. OW_MCU names the exact device macro and selects
      # the part file (its HSE/clock defaults ride along). `read` leaves a
      # missing trailing field empty.
      - name: Build Firmware Matrix
        run: |
          set -euo pipefail
          mkdir -p dist
          matrix=(
            "1_basic|-|-|ds18b20_1_basic_72mhz|"
            "2_device_search|-|-|ds18b20_2_device_search_72mhz|"
            "3_round_robin|-|-|ds18b20_3_round_robin_72mhz|"
            "4_scan_mode|-|-|ds18b20_4_scan_mode_72mhz|"
            "1_basic|-|8|ds18b20_1_basic_8mhz|"
            "2_device_search|-|8|ds18b20_2_device_search_8mhz|"
            "3_round_robin|-|8|ds18b20_3_round_robin_8mhz|"
            "4_scan_mode|-|8|ds18b20_4_scan_mode_8mhz|"
            "1_basic|STM32F030x6|-|ds18b20_1_basic_f0_48mhz|"
            "2_device_search|STM32F030x6|-|ds18b20_2_device_search_f0_48mhz|"
            "3_round_robin|STM32F030x6|-|ds18b20_3_round_robin_f0_48mhz|"
            "4_scan_mode|STM32F030x6|-|ds18b20_4_scan_mode_f0_48mhz|"
            "1_basic|STM32F030x6|8|ds18b20_1_basic_f0_8mhz|"
            "2_device_search|STM32F030x6|8|ds18b20_2_device_search_f0_8mhz|"
            "3_round_robin|STM32F030x6|8|ds18b20_3_round_robin_f0_8mhz|"
            "4_scan_mode|STM32F030x6|8|ds18b20_4_scan_mode_f0_8mhz|"
            "1_basic|STM32G031xx|-|ds18b20_1_basic_g0_64mhz|"
            "2_device_search|STM32G031xx|-|ds18b20_2_device_search_g0_64mhz|"
            "3_round_robin|STM32G031xx|-|ds18b20_3_round_robin_g0_64mhz|"
            "4_scan_mode|STM32G031xx|-|ds18b20_4_scan_mode_g0_64mhz|"
            "1_basic|STM32G031xx|16|ds18b20_1_basic_g0_16mhz|"
            "2_device_search|STM32G031xx|16|ds18b20_2_device_search_g0_16mhz|"
            "3_round_robin|STM32G031xx|16|ds18b20_3_round_robin_g0_16mhz|"
            "4_scan_mode|STM32G031xx|16|ds18b20_4_scan_mode_g0_16mhz|"
            "5_commands|-|-|ds18b20_5_commands_72mhz|"
            "6_statistics|-|-|ds18b20_6_statistics_72mhz|"
            "7_low_power|-|-|ds18b20_7_low_power_lp_72mhz|lowpower"
            "7_low_power|STM32F030x6|-|ds18b20_7_low_power_lp_f0_48mhz|lowpower"
            "7_low_power|STM32G031xx|-|ds18b20_7_low_power_lp_g0_64mhz|lowpower"
            "5_commands|-|8|ds18b20_5_commands_8mhz|"
            "6_statistics|-|8|ds18b20_6_statistics_8mhz|"
            "5_commands|STM32F030x6|-|ds18b20_5_commands_f0_48mhz|"
            "6_statistics|STM32F030x6|-|ds18b20_6_statistics_f0_48mhz|"
            "5_commands|STM32F030x6|8|ds18b20_5_commands_f0_8mhz|"
            "6_statistics|STM32F030x6|8|ds18b20_6_statistics_f0_8mhz|"
            "5_commands|STM32G031xx|-|ds18b20_5_commands_g0_64mhz|"
            "6_statistics|STM32G031xx|-|ds18b20_6_statistics_g0_64mhz|"
            "5_commands|STM32G031xx|16|ds18b20_5_commands_g0_16mhz|"
            "6_statistics|STM32G031xx|16|ds18b20_6_statistics_g0_16mhz|"
            # STM32F303xC (STM32F303VC) - 72MHz default via HSE, 64MHz via HSI/2+PLL, 8MHz raw HSI
            "1_basic|STM32F303xC|-|ds18b20_1_basic_f3_72mhz|"
            "2_device_search|STM32F303xC|-|ds18b20_2_device_search_f3_72mhz|"
            "3_round_robin|STM32F303xC|-|ds18b20_3_round_robin_f3_72mhz|"
            "4_scan_mode|STM32F303xC|-|ds18b20_4_scan_mode_f3_72mhz|"
            "5_commands|STM32F303xC|-|ds18b20_5_commands_f3_72mhz|"
            "6_statistics|STM32F303xC|-|ds18b20_6_statistics_f3_72mhz|"
            "7_low_power|STM32F303xC|-|ds18b20_7_low_power_lp_f3_72mhz|lowpower"
            "1_basic|STM32F303xC|64|ds18b20_1_basic_f3_64mhz|"
            "2_device_search|STM32F303xC|64|ds18b20_2_device_search_f3_64mhz|"
            "3_round_robin|STM32F303xC|64|ds18b20_3_round_robin_f3_64mhz|"
            "4_scan_mode|STM32F303xC|64|ds18b20_4_scan_mode_f3_64mhz|"
            "5_commands|STM32F303xC|64|ds18b20_5_commands_f3_64mhz|"
            "6_statistics|STM32F303xC|64|ds18b20_6_statistics_f3_64mhz|"
            "7_low_power|STM32F303xC|64|ds18b20_7_low_power_lp_f3_64mhz|lowpower"
            # STM32G474xx (WeAct Long) - 170MHz default via HSE+PLL, 16MHz raw HSI16 fallback
            "1_basic|STM32G474xx|-|ds18b20_1_basic_g4_170mhz|"
            "2_device_search|STM32G474xx|-|ds18b20_2_device_search_g4_170mhz|"
            "3_round_robin|STM32G474xx|-|ds18b20_3_round_robin_g4_170mhz|"
            "4_scan_mode|STM32G474xx|-|ds18b20_4_scan_mode_g4_170mhz|"
            "5_commands|STM32G474xx|-|ds18b20_5_commands_g4_170mhz|"
            "6_statistics|STM32G474xx|-|ds18b20_6_statistics_g4_170mhz|"
            "7_low_power|STM32G474xx|-|ds18b20_7_low_power_lp_g4_170mhz|lowpower"
            "1_basic|STM32G474xx|16|ds18b20_1_basic_g4_16mhz|"
            "2_device_search|STM32G474xx|16|ds18b20_2_device_search_g4_16mhz|"
            "3_round_robin|STM32G474xx|16|ds18b20_3_round_robin_g4_16mhz|"
            "4_scan_mode|STM32G474xx|16|ds18b20_4_scan_mode_g4_16mhz|"
            "5_commands|STM32G474xx|16|ds18b20_5_commands_g4_16mhz|"
            "6_statistics|STM32G474xx|16|ds18b20_6_statistics_g4_16mhz|"
            "7_low_power|STM32G474xx|16|ds18b20_7_low_power_lp_g4_16mhz|lowpower"
            # STM32H503xx (WeAct Core) - 64MHz raw-HSI default, 250MHz via HSE+PLL1, 8MHz raw HSE
            "1_basic|STM32H503xx|-|ds18b20_1_basic_h5_64mhz|"
            "2_device_search|STM32H503xx|-|ds18b20_2_device_search_h5_64mhz|"
            "3_round_robin|STM32H503xx|-|ds18b20_3_round_robin_h5_64mhz|"
            "4_scan_mode|STM32H503xx|-|ds18b20_4_scan_mode_h5_64mhz|"
            "5_commands|STM32H503xx|-|ds18b20_5_commands_h5_64mhz|"
            "6_statistics|STM32H503xx|-|ds18b20_6_statistics_h5_64mhz|"
            "7_low_power|STM32H503xx|-|ds18b20_7_low_power_lp_h5_64mhz|lowpower"
            "1_basic|STM32H503xx|250|ds18b20_1_basic_h5_250mhz|"
            "2_device_search|STM32H503xx|250|ds18b20_2_device_search_h5_250mhz|"
            "3_round_robin|STM32H503xx|250|ds18b20_3_round_robin_h5_250mhz|"
            "4_scan_mode|STM32H503xx|250|ds18b20_4_scan_mode_h5_250mhz|"
            "5_commands|STM32H503xx|250|ds18b20_5_commands_h5_250mhz|"
            "6_statistics|STM32H503xx|250|ds18b20_6_statistics_h5_250mhz|"
            "7_low_power|STM32H503xx|250|ds18b20_7_low_power_lp_h5_250mhz|lowpower"
            "1_basic|STM32H503xx|8|ds18b20_1_basic_h5_8mhz|"
            "2_device_search|STM32H503xx|8|ds18b20_2_device_search_h5_8mhz|"
            "3_round_robin|STM32H503xx|8|ds18b20_3_round_robin_h5_8mhz|"
            "4_scan_mode|STM32H503xx|8|ds18b20_4_scan_mode_h5_8mhz|"
            "5_commands|STM32H503xx|8|ds18b20_5_commands_h5_8mhz|"
            "6_statistics|STM32H503xx|8|ds18b20_6_statistics_h5_8mhz|"
            "7_low_power|STM32H503xx|8|ds18b20_7_low_power_lp_h5_8mhz|lowpower"
            "2_device_search|STM32F407xx|-|ds18b20_2_device_search_f407xx_168mhz|"
            "3_round_robin|STM32F407xx|-|ds18b20_3_round_robin_f407xx_168mhz|"
            "4_scan_mode|STM32F407xx|-|ds18b20_4_scan_mode_f407xx_168mhz|"
            "1_basic|STM32F407xx|16|ds18b20_1_basic_f407xx_16mhz|"
            "2_device_search|STM32F407xx|16|ds18b20_2_device_search_f407xx_16mhz|"
            "3_round_robin|STM32F407xx|16|ds18b20_3_round_robin_f407xx_16mhz|"
            "4_scan_mode|STM32F407xx|16|ds18b20_4_scan_mode_f407xx_16mhz|"
            "5_commands|STM32F407xx|-|ds18b20_5_commands_f407xx_168mhz|"
            "6_statistics|STM32F407xx|-|ds18b20_6_statistics_f407xx_168mhz|"
            "5_commands|STM32F407xx|16|ds18b20_5_commands_f407xx_16mhz|"
            "6_statistics|STM32F407xx|16|ds18b20_6_statistics_f407xx_16mhz|"
            "7_low_power|STM32F407xx|-|ds18b20_7_low_power_lp_f407xx_168mhz|lowpower"
            "1_basic|STM32F401xC|-|ds18b20_1_basic_f401xc_84mhz|"
            "2_device_search|STM32F401xC|-|ds18b20_2_device_search_f401xc_84mhz|"
            "3_round_robin|STM32F401xC|-|ds18b20_3_round_robin_f401xc_84mhz|"
            "4_scan_mode|STM32F401xC|-|ds18b20_4_scan_mode_f401xc_84mhz|"
            "1_basic|STM32F401xC|16|ds18b20_1_basic_f401xc_16mhz|"
            "2_device_search|STM32F401xC|16|ds18b20_2_device_search_f401xc_16mhz|"
            "3_round_robin|STM32F401xC|16|ds18b20_3_round_robin_f401xc_16mhz|"
            "4_scan_mode|STM32F401xC|16|ds18b20_4_scan_mode_f401xc_16mhz|"
            "5_commands|STM32F401xC|-|ds18b20_5_commands_f401xc_84mhz|"
            "6_statistics|STM32F401xC|-|ds18b20_6_statistics_f401xc_84mhz|"
            "5_commands|STM32F401xC|16|ds18b20_5_commands_f401xc_16mhz|"
            "6_statistics|STM32F401xC|16|ds18b20_6_statistics_f401xc_16mhz|"
            "7_low_power|STM32F401xC|-|ds18b20_7_low_power_lp_f401xc_84mhz|lowpower"
            # STM32F446xx: 180MHz is the part's own default, not an override, and it is
            # the only F4 clock that needs the over-drive sequence - so it is a
            # distinct firmware from the f407xx 168MHz rows above, built from its
            # own part file. The 16MHz rows are the no-crystal fallback.
            "1_basic|STM32F446xx|-|ds18b20_1_basic_f446xx_180mhz|"
            "2_device_search|STM32F446xx|-|ds18b20_2_device_search_f446xx_180mhz|"
            "3_round_robin|STM32F446xx|-|ds18b20_3_round_robin_f446xx_180mhz|"
            "4_scan_mode|STM32F446xx|-|ds18b20_4_scan_mode_f446xx_180mhz|"
            "1_basic|STM32F446xx|16|ds18b20_1_basic_f446xx_16mhz|"
            "2_device_search|STM32F446xx|16|ds18b20_2_device_search_f446xx_16mhz|"
            "3_round_robin|STM32F446xx|16|ds18b20_3_round_robin_f446xx_16mhz|"
            "4_scan_mode|STM32F446xx|16|ds18b20_4_scan_mode_f446xx_16mhz|"
            "5_commands|STM32F446xx|-|ds18b20_5_commands_f446xx_180mhz|"
            "6_statistics|STM32F446xx|-|ds18b20_6_statistics_f446xx_180mhz|"
            "5_commands|STM32F446xx|16|ds18b20_5_commands_f446xx_16mhz|"
            "6_statistics|STM32F446xx|16|ds18b20_6_statistics_f446xx_16mhz|"
            "7_low_power|STM32F446xx|-|ds18b20_7_low_power_lp_f446xx_180mhz|lowpower"
            # 8_ds2431: one default-clock build per MCU. The DS2431 EEPROM
            # example ships no clock or EXT variants, so this is the complete
            # set - nine rows, one per family member in the matrix above.
            "8_ds2431|-|-|ds18b20_8_ds2431_72mhz|"
            "8_ds2431|STM32F030x6|-|ds18b20_8_ds2431_f0_48mhz|"
            "8_ds2431|STM32G031xx|-|ds18b20_8_ds2431_g0_64mhz|"
            "8_ds2431|STM32F303xC|-|ds18b20_8_ds2431_f3_72mhz|"
            "8_ds2431|STM32G474xx|-|ds18b20_8_ds2431_g4_170mhz|"
            "8_ds2431|STM32H503xx|-|ds18b20_8_ds2431_h5_64mhz|"
            "8_ds2431|STM32F407xx|-|ds18b20_8_ds2431_f407xx_168mhz|"
            "8_ds2431|STM32F401xC|-|ds18b20_8_ds2431_f401xc_84mhz|"
            "8_ds2431|STM32F446xx|-|ds18b20_8_ds2431_f446xx_180mhz|"
          )
          for row in "${matrix[@]}"; do
            IFS='|' read -r app mcu sysclk out ext <<< "$row"
            flags=""
            [ "$mcu" != "-" ] && flags="$flags OW_MCU=$mcu"
            [ "$sysclk" != "-" ] && flags="$flags SYSCLK_MHZ=$sysclk"
            [ "$ext" = "lowpower" ] && flags="$flags EXT=-DOW_PORT_LOW_POWER=1"
            echo "::group::build $out (APP=$app OW_MCU=${mcu:--} SYSCLK_MHZ=$sysclk EXT=$ext)"
            make clean
            make APP=$app $flags
            for e in elf hex bin; do
              cp "build/ds18b20_$app.$e" "dist/$out.$e"
            done
            echo "::endgroup::"
          done

      # Step 7: Stage license and checksums over all variants
      - name: Stage License and Checksums
        run: |
          cp LICENSE dist/LICENSE
          cd dist && sha256sum * > SHA256SUMS.txt

      # Step 8: Ship one archive instead of ~400 loose release assets.
      # A single upload also keeps us clear of GitHub's secondary rate limit,
      # which a burst of 400+ asset uploads trips.
      - name: Package firmware archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          zip -9 -X "../firmware-${version}.zip" *

      # Step 10: Publish the release with notes and artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            # stm32-async-1wire

            Non-blocking 1-Wire master for STM32 with DS18B20 temperature and
            DS2431 EEPROM drivers built on top — bare-metal, register-level.
            1-Wire timing is handled entirely by TIM1 and DMA — no interrupts,
            no software delays, minimal CPU usage.             One MCU-independent core and
            seven header-only backends (F0/F1/F3/F4/G0/G4/H5) selected at build time with
            `make OW_MCU=STM32F030x6` / `make OW_MCU=STM32F303xC` / `make OW_MCU=STM32F407xx` /
            `make OW_MCU=STM32G031xx` / `make OW_MCU=STM32G474xx` / `make OW_MCU=STM32H503xx`.

            ## What's new in 2.4.0

            - **DS2431 EEPROM driver** (`inc/ds2431.h`, `src/ds2431.c`): the
              DS2431 command-transaction engine (Read Memory, Write/Read
              Scratchpad, Copy Scratchpad) on the shared non-blocking 1-Wire
              core, with a new example `8_ds2431` and a host test suite
              (`make test-ds2431`).
            - **`OW_MCU` selects family and part in one key**:
              `make OW_MCU=STM32F103xB` (or `-DOW_MCU=...` under CMake)
              resolves the family, the part file and the clock defaults;
              `OW_TARGET`/`OW_CHIP` remain the detailed selectors.
            - **Release artifacts for `8_ds2431`**: 9 firmware variants (one
              per MCU at its default clock) ship inside `firmware-2.4.0.zip`.
            - **Unified port headers** (`inc/ow_mcu.h` + `inc/ow_port.h`):
              the family backends and the shared TIM1+DMA core now live in
              `inc/`, so external projects need a single include path
              (`-Iinc`). Firmware images are byte-identical.
            - **`SystemCoreClock` auto-detection**: when `OW_PORT_SYSCLK_MHZ`
              is not passed, the port core derives the prescaler and the
              filter tier from the CMSIS `SystemCoreClock` instead of a
              guessed header default.
            - **Manual integrators**: the `OW_PORT_TARGET_F0` …
              `OW_PORT_TARGET_H5` macros are gone — select with the CMSIS
              device macro (`-DSTM32F103xB`) or a family macro (`-DSTM32F1`).
              Make/CMake builds are unaffected.

            ## What's new in 2.3.0

            - **STM32H5 backend** (`port/stm32h5/ow_port_h5.h`): STM32H503CB on
              the shared TIM1 core with GPDMA1 channels 2/3 (requests 59/61, no
              DMAMUX), bus on PA10 (AF1), console USART1 TX on PA9 (AF7), busy
              LED on PC13 (active-low). Three clocks: 64MHz raw HSI (default),
              8MHz raw HSE, 250MHz via HSE+PLL1 (M=HSE/4, N=125, P=2, VOS0,
              5 flash wait states). Bench-validated on the WeAct STM32H503Cx
              Core Board: all seven examples at each clock, 7 sensors found,
              correct readings, 0 errors in `6_statistics`.
            - **Low-power long-stage rule is uniform and stateless**: whether a
              stage may be slept through is derived from the scheduled timer
              for every arm path (measurement conversions and scratchpad reads
              as well as multi-slot writes and command transactions), so long
              stages sleep through `WFE` instead of busy-polling.
            - **Release artifacts for H5**: 21 firmware variants (7 apps × 3
              clocks) ship as `.elf`/`.hex`/`.bin` below.

            ## What's new in 2.2.0

            - **STM32F3 backend** (`port/stm32f3/ow_port_f3.h`): STM32F303VC at
              72MHz (HSE+PLL, default), 64MHz (HSI/2+PLL) and 8MHz raw HSI.
            - **STM32G4 port** (WeAct G474CBT6 Long): 170MHz via HSE+PLL
              (M=2, N=85, R=2, Range 1 Boost) plus 16MHz raw-HSI16 fallback;
              busy LED on PA8 (active-high).
            - **Alarm Search demo** in `5_commands`: forced alarm thresholds
              plus Alarm Search (0xEC) reporting only alarmed devices.
            - **Lone device macros resolve**: a bare `-DSTM32F446xx` or
              `-DSTM32F303xC` now selects its family.

            ## What's new in 2.1.1

            - **LTO is back on F0/G0**: the Cortex-M0/M0+ `-flto` exclusion
              (a GCC 14 thin-LTO link failure) is gone — the firmware links
              cleanly under the pinned Arm GNU Toolchain 15.2, and the F0
              bench matrix (all seven examples at 48MHz and 8MHz,
              parasite-powered) matches the no-LTO reference logs cell for
              cell. On `1_basic` (F030x6 @48MHz) `text` shrinks from 8316 to
              3740 bytes.
            - **CI firmware builds use the pinned 15.2 toolchain**, same as
              the build and release workflows — no more unpinned GCC.

            ## What's new in 2.0.0

            Four breaking changes on the public surface, and the F4 backend that
            makes them worth a major version:

            - **Byte-oriented write API**: `onewire_write_slots()` and
              `onewire_encode_byte()` are replaced by `onewire_write_command()` and
              `onewire_write_command_byte()`. Commands are encoded synchronously into
              an internal pulse buffer and the transfer is scheduled in one call.
            - **Unified parasite knob**: `PARASITE_POWER` and `OW_TIMING_PARASITE` are
              gone, replaced by a single `OW_PARASITE_POWER=0/1` that both widens the
              driver guard band and tells the examples to call
              `ds18b20_set_parasite(1)`.
            - **`STATS_DUMP_INTERVAL` → `STATS_DUMP_SWEEPS`**: the statistics period is
              counted in sweeps (one pass over every device) rather than
              measurements, and is defined once in the example's source instead of
              being forced by both build systems.
            - **`OW_CHIP=f401` → `OW_CHIP=f401xc`**: the part is named by its CMSIS
              flash-density code, and `f401xe` joins it.

            New in this release:

            - **STM32F4 backend** (`port/stm32f4/ow_port_f4.h`), chip-generic across
              the STM32F407VGT6 (F4DISCOVERY, 168MHz) and the STM32F401CC (WeAct F401
              Black Pill, 84MHz off its 25MHz crystal) - the same TIM1/DMA2/`CHSEL=6`
              topology and the same `port/common/ow_port_tim_dma.h` core that the F0,
              F1 and G0 backends now share. All seven examples were run on both
              boards, the F401CC at its 84MHz default.
            - **`HSE_MHZ=N`**: the crystal is a board property, not a part one, so the
              F4 PLL takes its input divider from it instead of assuming 8MHz. A wrong
              value is no longer silent - the waits are bounded and the application says
              so.
            - **Per-part build matrix** in `chips/<part>.mk`, and an unknown
              `OW_TARGET`/`OW_CHIP` is a build error rather than a silent fall-through
              to the F1 default.
            - **No hidden measurement cycles**: the driver starts nothing on its own;
              `ds18b20_start_measure()` is the explicit, one-shot request, and the
              inter-measurement pause left the library.
            - **`inc/ow_config.h`**: one compile-time configuration header.
            - **`config/optim.mk`**, shared by the Makefile and CMake so both build the
              same firmware with the same warning and optimisation flags.

            See `CHANGELOG.md` for the full list; the `1.8.1` section there is
            reconstructed from its commits, since that release shipped without one.

