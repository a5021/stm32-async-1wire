name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the tagged source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Cache the Arm Toolchain (Version 15.2)
      - name: Cache Arm Toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: /opt/gcc-arm-none-eabi
          key: ${{ runner.os }}-gcc-arm-none-eabi-15.2

      # Step 3: Install Toolchain if not in cache
      - name: Install Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm-none-eabi
          wget -qO- https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz | sudo tar -xJv -C /opt/gcc-arm-none-eabi --strip-components=1

      # Step 3b: Put the toolchain on PATH unconditionally. The cache-hit
      # branch skips Step 3 entirely, so the PATH must be set here regardless
      # of whether the toolchain was just installed or restored from cache.
      - name: Add Toolchain to PATH
        run: echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      # Step 4: Cache project dependencies (CMSIS headers, SVD)
      - name: Cache Project Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}

      # Step 5: Download dependencies only if cache is missing
      - name: Download Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps

      # Step 6: Build the full firmware matrix.
      # One row per published variant: APP | OW_TARGET | SYSCLK_MHZ | output stem | EXT.
      # A "-" target means the default (F1); F1 keeps its historical artifact
      # names without the target infix, F0 artifacts carry "_f0_". An empty EXT
      # builds the default configuration; "lowpower" adds -DOW_PORT_LOW_POWER.
      - name: Build Firmware Matrix
        run: |
          set -euo pipefail
          mkdir -p dist
          matrix=(
            "1_basic|-|-|ds18b20_1_basic_72mhz|"
            "2_device_search|-|-|ds18b20_2_device_search_72mhz|"
            "3_round_robin|-|-|ds18b20_3_round_robin_72mhz|"
            "4_scan_mode|-|-|ds18b20_4_scan_mode_72mhz|"
            "1_basic|-|8|ds18b20_1_basic_8mhz|"
            "2_device_search|-|8|ds18b20_2_device_search_8mhz|"
            "3_round_robin|-|8|ds18b20_3_round_robin_8mhz|"
            "4_scan_mode|-|8|ds18b20_4_scan_mode_8mhz|"
            "1_basic|f0|-|ds18b20_1_basic_f0_48mhz|"
            "2_device_search|f0|-|ds18b20_2_device_search_f0_48mhz|"
            "3_round_robin|f0|-|ds18b20_3_round_robin_f0_48mhz|"
            "4_scan_mode|f0|-|ds18b20_4_scan_mode_f0_48mhz|"
            "1_basic|f0|8|ds18b20_1_basic_f0_8mhz|"
            "2_device_search|f0|8|ds18b20_2_device_search_f0_8mhz|"
            "3_round_robin|f0|8|ds18b20_3_round_robin_f0_8mhz|"
            "4_scan_mode|f0|8|ds18b20_4_scan_mode_f0_8mhz|"
            "1_basic|g0|-|ds18b20_1_basic_g0_64mhz|"
            "2_device_search|g0|-|ds18b20_2_device_search_g0_64mhz|"
            "3_round_robin|g0|-|ds18b20_3_round_robin_g0_64mhz|"
            "4_scan_mode|g0|-|ds18b20_4_scan_mode_g0_64mhz|"
            "1_basic|g0|16|ds18b20_1_basic_g0_16mhz|"
            "2_device_search|g0|16|ds18b20_2_device_search_g0_16mhz|"
            "3_round_robin|g0|16|ds18b20_3_round_robin_g0_16mhz|"
            "4_scan_mode|g0|16|ds18b20_4_scan_mode_g0_16mhz|"
            "5_commands|-|-|ds18b20_5_commands_72mhz|"
            "6_statistics|-|-|ds18b20_6_statistics_72mhz|"
            "7_low_power|-|-|ds18b20_7_low_power_lp_72mhz|lowpower"
            "7_low_power|f0|-|ds18b20_7_low_power_lp_f0_48mhz|lowpower"
            "7_low_power|g0|-|ds18b20_7_low_power_lp_g0_64mhz|lowpower"
            "5_commands|-|8|ds18b20_5_commands_8mhz|"
            "6_statistics|-|8|ds18b20_6_statistics_8mhz|"
            "5_commands|f0|-|ds18b20_5_commands_f0_48mhz|"
            "6_statistics|f0|-|ds18b20_6_statistics_f0_48mhz|"
            "5_commands|f0|8|ds18b20_5_commands_f0_8mhz|"
            "6_statistics|f0|8|ds18b20_6_statistics_f0_8mhz|"
            "5_commands|g0|-|ds18b20_5_commands_g0_64mhz|"
            "6_statistics|g0|-|ds18b20_6_statistics_g0_64mhz|"
            "5_commands|g0|16|ds18b20_5_commands_g0_16mhz|"
            "6_statistics|g0|16|ds18b20_6_statistics_g0_16mhz|"
          )
          for row in "${matrix[@]}"; do
            IFS='|' read -r app target sysclk out ext <<< "$row"
            flags=""
            [ "$target" != "-" ] && flags="$flags OW_TARGET=$target"
            [ "$sysclk" != "-" ] && flags="$flags SYSCLK_MHZ=$sysclk"
            [ "$ext" = "lowpower" ] && flags="$flags EXT=-DOW_PORT_LOW_POWER"
            echo "::group::build $out (APP=$app OW_TARGET=$target SYSCLK_MHZ=$sysclk EXT=$ext)"
            make clean
            make APP=$app $flags
            for e in elf hex bin; do
              cp "build/ds18b20_$app.$e" "dist/$out.$e"
            done
            echo "::endgroup::"
          done

      # Step 7: Stage license and checksums over all variants
      - name: Stage License and Checksums
        run: |
          cp LICENSE dist/LICENSE
          cd dist && sha256sum * > SHA256SUMS.txt

      # Step 10: Publish the release with notes and artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            # stm32-async-1wire

            Non-blocking 1-Wire master for STM32 with a DS18B20 temperature driver
            built on top — bare-metal, register-level.
            1-Wire timing is handled entirely by TIM1 and DMA — no interrupts,
            no software delays, minimal CPU usage. One MCU-independent core and
            three header-only backends (F0/F1/G0) selected at build time with
            `make OW_TARGET=f0` / `make OW_TARGET=g0`.

            ## What's new in 1.8.1

            - **Restructured examples**: demo files renamed to numbered
              directories (`1_basic`, `2_device_search`, `3_round_robin`,
              `4_scan_mode`, `5_commands`, `6_statistics`, `7_low_power`)
            - **CMake install targets**: `find_package(stm32_async_1wire)` support
            - **Version macros**: `STM32_ASYNC_1WIRE_VERSION_MAJOR/MINOR/PATCH`
            - **C++ compatibility**: `extern "C"` guards on all public headers
            - **Renamed `macro.h` → `ow_bits.h`**: avoids newlib name conflict
            - **Doxygen API docs**: auto-deployed to gh-pages via CI

            ## Download

            Each example ships as `.bin` / `.hex` / `.elf` (see `SHA256SUMS.txt`
            for integrity checksums):

            | Target | Clock | Artifact stems |
            |--------|-------|----------------|
            | STM32F103C8T6 | 72MHz (HSE+PLL, default) | `ds18b20_1_basic_72mhz`, …`2_device_search_72mhz`, …`3_round_robin_72mhz`, …`4_scan_mode_72mhz`, `ds18b20_5_commands_72mhz`, `ds18b20_6_statistics_72mhz`, `ds18b20_7_low_power_lp_72mhz` |
            | STM32F103C8T6 | 8MHz HSI (no crystal) | `ds18b20_1_basic_8mhz`, …`2_device_search_8mhz`, …`3_round_robin_8mhz`, …`4_scan_mode_8mhz`, `ds18b20_5_commands_8mhz`, `ds18b20_6_statistics_8mhz` |
            | STM32F030x6 | 48MHz (HSI+PLL, default) | `ds18b20_1_basic_f0_48mhz`, …`2_device_search_f0_48mhz`, …`3_round_robin_f0_48mhz`, …`4_scan_mode_f0_48mhz`, `ds18b20_5_commands_f0_48mhz`, `ds18b20_6_statistics_f0_48mhz`, `ds18b20_7_low_power_lp_f0_48mhz` |
            | STM32F030x6 | 8MHz HSI | `ds18b20_1_basic_f0_8mhz`, …`2_device_search_f0_8mhz`, …`3_round_robin_f0_8mhz`, …`4_scan_mode_f0_8mhz`, `ds18b20_5_commands_f0_8mhz`, `ds18b20_6_statistics_f0_8mhz` |
            | STM32G031x6 | 64MHz (HSI16+PLL, default) | `ds18b20_1_basic_g0_64mhz`, …`2_device_search_g0_64mhz`, …`3_round_robin_g0_64mhz`, …`4_scan_mode_g0_64mhz`, `ds18b20_5_commands_g0_64mhz`, `ds18b20_6_statistics_g0_64mhz`, `ds18b20_7_low_power_lp_g0_64mhz` |
            | STM32G031x6 | 16MHz HSI16 (bus on PA12 pad via remap) | `ds18b20_1_basic_g0_16mhz`, …`2_device_search_g0_16mhz`, …`3_round_robin_g0_16mhz`, …`4_scan_mode_g0_16mhz`, `ds18b20_5_commands_g0_16mhz`, `ds18b20_6_statistics_g0_16mhz` |

            Examples: `1_basic` — single sensor via Skip ROM; `2_device_search` — device
            search + per-device polling (one Convert T per sensor); `3_round_robin` —
            device search + round-robin polling of every sensor; `4_scan_mode` —
            device search + simultaneous multi-device conversion; `5_commands` —
            device search + command transactions (power supply, scratchpad,
            TH/TL, Copy/Recall EEPROM, Read ROM); `6_statistics` — device search +
            signal-statistics dump over UART (`-DOW_STATS_ENABLE`); `7_low_power` —
            low-power example (`-DOW_PORT_LOW_POWER`) that sleeps in `__WFE()`.

            ## Highlights

            - **True non-blocking 1-Wire**: TIM1 Output Compare + Input Capture with DMA — a hardware state machine does the timing, the CPU just polls a flag
            - **Zero interrupts**: no NVIC IRQs at all
            - **Pure bare-metal C**: register-level, no HAL/LL, arm-none-eabi-gcc
            - **Three MCU backends**: STM32F1 (bus on PA10), STM32F0 (bus on PA10) and STM32G0 (bus on PA12 via remap), one shared core
            - **Accuracy**: 0.1 °C resolution, ±0.5 °C typical, one reading every ~0.76 s
            - **CRC-8 validation** on every 9-byte scratchpad read
            - **Weak callbacks** `ds18b20_busy()` / `ds18b20_complete()`
            - **Tooling**: CI (clang-format, cppcheck, GCC -fanalyzer), host test suite for all backends (`make test`, `make test-f0`, `make test-g0`) plus a low-power suite (`make test-lowpower`), VSCode J-Link/ST-Link debug configs

            ## Getting started

            See the [README](https://github.com/a5021/stm32-async-1wire#readme):
            include `ds18b20.h`, call `ds18b20_init()` once, then `ds18b20_poll()` in your main loop.

            ---
