name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the tagged source code
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 2: Cache the Arm Toolchain (Version 15.2)
      - name: Cache Arm Toolchain
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: /opt/gcc-arm-none-eabi
          key: ${{ runner.os }}-gcc-arm-none-eabi-15.2

      # Step 3: Install Toolchain if not in cache
      - name: Install Toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/gcc-arm-none-eabi
          wget -qO- https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz | sudo tar -xJv -C /opt/gcc-arm-none-eabi --strip-components=1

      # Step 3b: Put the toolchain on PATH unconditionally. The cache-hit
      # branch skips Step 3 entirely, so the PATH must be set here regardless
      # of whether the toolchain was just installed or restored from cache.
      - name: Add Toolchain to PATH
        run: echo "/opt/gcc-arm-none-eabi/bin" >> $GITHUB_PATH

      # Step 4: Cache project dependencies (CMSIS headers, SVD)
      - name: Cache Project Dependencies
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: CMSIS/
          key: ${{ runner.os }}-cmsis-${{ hashFiles('Makefile') }}

      # Step 5: Download dependencies only if cache is missing
      - name: Download Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: make download-deps

      # Step 6: Build the full firmware matrix.
      # One row per published variant: APP | OW_TARGET | SYSCLK_MHZ | output stem | EXT | OW_CHIP
      # A "-" target means the default (F1); F1 keeps its historical artifact
      # names without the target infix, F0 artifacts carry "_f0_". An empty EXT
      # builds the default configuration; "lowpower" adds -DOW_PORT_LOW_POWER=1.
      # OW_CHIP selects a part inside the F4 family and is empty elsewhere:
      # f407xx runs at its 168MHz default, f401xc at the F401 84MHz cap off the
      # 25MHz crystal of the WeAct F401 Black Pill. `read` leaves a missing
      # trailing field empty, so the rows above need no OW_CHIP column.
      - name: Build Firmware Matrix
        run: |
          set -euo pipefail
          mkdir -p dist
          matrix=(
            "1_basic|-|-|ds18b20_1_basic_72mhz|"
            "2_device_search|-|-|ds18b20_2_device_search_72mhz|"
            "3_round_robin|-|-|ds18b20_3_round_robin_72mhz|"
            "4_scan_mode|-|-|ds18b20_4_scan_mode_72mhz|"
            "1_basic|-|8|ds18b20_1_basic_8mhz|"
            "2_device_search|-|8|ds18b20_2_device_search_8mhz|"
            "3_round_robin|-|8|ds18b20_3_round_robin_8mhz|"
            "4_scan_mode|-|8|ds18b20_4_scan_mode_8mhz|"
            "1_basic|f0|-|ds18b20_1_basic_f0_48mhz|"
            "2_device_search|f0|-|ds18b20_2_device_search_f0_48mhz|"
            "3_round_robin|f0|-|ds18b20_3_round_robin_f0_48mhz|"
            "4_scan_mode|f0|-|ds18b20_4_scan_mode_f0_48mhz|"
            "1_basic|f0|8|ds18b20_1_basic_f0_8mhz|"
            "2_device_search|f0|8|ds18b20_2_device_search_f0_8mhz|"
            "3_round_robin|f0|8|ds18b20_3_round_robin_f0_8mhz|"
            "4_scan_mode|f0|8|ds18b20_4_scan_mode_f0_8mhz|"
            "1_basic|g0|-|ds18b20_1_basic_g0_64mhz|"
            "2_device_search|g0|-|ds18b20_2_device_search_g0_64mhz|"
            "3_round_robin|g0|-|ds18b20_3_round_robin_g0_64mhz|"
            "4_scan_mode|g0|-|ds18b20_4_scan_mode_g0_64mhz|"
            "1_basic|g0|16|ds18b20_1_basic_g0_16mhz|"
            "2_device_search|g0|16|ds18b20_2_device_search_g0_16mhz|"
            "3_round_robin|g0|16|ds18b20_3_round_robin_g0_16mhz|"
            "4_scan_mode|g0|16|ds18b20_4_scan_mode_g0_16mhz|"
            "5_commands|-|-|ds18b20_5_commands_72mhz|"
            "6_statistics|-|-|ds18b20_6_statistics_72mhz|"
            "7_low_power|-|-|ds18b20_7_low_power_lp_72mhz|lowpower"
            "7_low_power|f0|-|ds18b20_7_low_power_lp_f0_48mhz|lowpower"
            "7_low_power|g0|-|ds18b20_7_low_power_lp_g0_64mhz|lowpower"
            "5_commands|-|8|ds18b20_5_commands_8mhz|"
            "6_statistics|-|8|ds18b20_6_statistics_8mhz|"
            "5_commands|f0|-|ds18b20_5_commands_f0_48mhz|"
            "6_statistics|f0|-|ds18b20_6_statistics_f0_48mhz|"
            "5_commands|f0|8|ds18b20_5_commands_f0_8mhz|"
            "6_statistics|f0|8|ds18b20_6_statistics_f0_8mhz|"
            "5_commands|g0|-|ds18b20_5_commands_g0_64mhz|"
            "6_statistics|g0|-|ds18b20_6_statistics_g0_64mhz|"
            "5_commands|g0|16|ds18b20_5_commands_g0_16mhz|"
            "6_statistics|g0|16|ds18b20_6_statistics_g0_16mhz|"
            # F303xC (STM32F303VC) - 72MHz default via HSE, 64MHz via HSI/2+PLL, 8MHz raw HSI
            "1_basic|f3|-|ds18b20_1_basic_f3_72mhz||f303xc"
            "2_device_search|f3|-|ds18b20_2_device_search_f3_72mhz||f303xc"
            "3_round_robin|f3|-|ds18b20_3_round_robin_f3_72mhz||f303xc"
            "4_scan_mode|f3|-|ds18b20_4_scan_mode_f3_72mhz||f303xc"
            "5_commands|f3|-|ds18b20_5_commands_f3_72mhz||f303xc"
            "6_statistics|f3|-|ds18b20_6_statistics_f3_72mhz||f303xc"
            "7_low_power|f3|-|ds18b20_7_low_power_lp_f3_72mhz|lowpower"
            "1_basic|f3|64|ds18b20_1_basic_f3_64mhz||f303xc"
            "2_device_search|f3|64|ds18b20_2_device_search_f3_64mhz||f303xc"
            "3_round_robin|f3|64|ds18b20_3_round_robin_f3_64mhz||f303xc"
            "4_scan_mode|f3|64|ds18b20_4_scan_mode_f3_64mhz||f303xc"
            "5_commands|f3|64|ds18b20_5_commands_f3_64mhz||f303xc"
            "6_statistics|f3|64|ds18b20_6_statistics_f3_64mhz||f303xc"
            "7_low_power|f3|64|ds18b20_7_low_power_lp_f3_64mhz|lowpower"
            # G474CB (WeAct Long) - 170MHz default via HSE+PLL, 16MHz raw HSI16 fallback
            "1_basic|g4|-|ds18b20_1_basic_g4_170mhz||g474cb"
            "2_device_search|g4|-|ds18b20_2_device_search_g4_170mhz||g474cb"
            "3_round_robin|g4|-|ds18b20_3_round_robin_g4_170mhz||g474cb"
            "4_scan_mode|g4|-|ds18b20_4_scan_mode_g4_170mhz||g474cb"
            "5_commands|g4|-|ds18b20_5_commands_g4_170mhz||g474cb"
            "6_statistics|g4|-|ds18b20_6_statistics_g4_170mhz||g474cb"
            "7_low_power|g4|-|ds18b20_7_low_power_lp_g4_170mhz|lowpower|g474cb"
            "1_basic|g4|16|ds18b20_1_basic_g4_16mhz||g474cb"
            "2_device_search|g4|16|ds18b20_2_device_search_g4_16mhz||g474cb"
            "3_round_robin|g4|16|ds18b20_3_round_robin_g4_16mhz||g474cb"
            "4_scan_mode|g4|16|ds18b20_4_scan_mode_g4_16mhz||g474cb"
            "5_commands|g4|16|ds18b20_5_commands_g4_16mhz||g474cb"
            "6_statistics|g4|16|ds18b20_6_statistics_g4_16mhz||g474cb"
            "7_low_power|g4|16|ds18b20_7_low_power_lp_g4_16mhz|lowpower|g474cb"
            "2_device_search|f4|-|ds18b20_2_device_search_f407xx_168mhz||f407xx"
            "3_round_robin|f4|-|ds18b20_3_round_robin_f407xx_168mhz||f407xx"
            "4_scan_mode|f4|-|ds18b20_4_scan_mode_f407xx_168mhz||f407xx"
            "1_basic|f4|16|ds18b20_1_basic_f407xx_16mhz||f407xx"
            "2_device_search|f4|16|ds18b20_2_device_search_f407xx_16mhz||f407xx"
            "3_round_robin|f4|16|ds18b20_3_round_robin_f407xx_16mhz||f407xx"
            "4_scan_mode|f4|16|ds18b20_4_scan_mode_f407xx_16mhz||f407xx"
            "5_commands|f4|-|ds18b20_5_commands_f407xx_168mhz||f407xx"
            "6_statistics|f4|-|ds18b20_6_statistics_f407xx_168mhz||f407xx"
            "5_commands|f4|16|ds18b20_5_commands_f407xx_16mhz||f407xx"
            "6_statistics|f4|16|ds18b20_6_statistics_f407xx_16mhz||f407xx"
            "7_low_power|f4|-|ds18b20_7_low_power_lp_f407xx_168mhz|lowpower|f407xx"
            "1_basic|f4|-|ds18b20_1_basic_f401xc_84mhz||f401xc"
            "2_device_search|f4|-|ds18b20_2_device_search_f401xc_84mhz||f401xc"
            "3_round_robin|f4|-|ds18b20_3_round_robin_f401xc_84mhz||f401xc"
            "4_scan_mode|f4|-|ds18b20_4_scan_mode_f401xc_84mhz||f401xc"
            "1_basic|f4|16|ds18b20_1_basic_f401xc_16mhz||f401xc"
            "2_device_search|f4|16|ds18b20_2_device_search_f401xc_16mhz||f401xc"
            "3_round_robin|f4|16|ds18b20_3_round_robin_f401xc_16mhz||f401xc"
            "4_scan_mode|f4|16|ds18b20_4_scan_mode_f401xc_16mhz||f401xc"
            "5_commands|f4|-|ds18b20_5_commands_f401xc_84mhz||f401xc"
            "6_statistics|f4|-|ds18b20_6_statistics_f401xc_84mhz||f401xc"
            "5_commands|f4|16|ds18b20_5_commands_f401xc_16mhz||f401xc"
            "6_statistics|f4|16|ds18b20_6_statistics_f401xc_16mhz||f401xc"
            "7_low_power|f4|-|ds18b20_7_low_power_lp_f401xc_84mhz|lowpower|f401xc"
            # F446: 180MHz is the part's own default, not an override, and it is
            # the only F4 clock that needs the over-drive sequence - so it is a
            # distinct firmware from the f407xx 168MHz rows above, built from its
            # own part file. The 16MHz rows are the no-crystal fallback.
            "1_basic|f4|-|ds18b20_1_basic_f446xx_180mhz||f446xx"
            "2_device_search|f4|-|ds18b20_2_device_search_f446xx_180mhz||f446xx"
            "3_round_robin|f4|-|ds18b20_3_round_robin_f446xx_180mhz||f446xx"
            "4_scan_mode|f4|-|ds18b20_4_scan_mode_f446xx_180mhz||f446xx"
            "1_basic|f4|16|ds18b20_1_basic_f446xx_16mhz||f446xx"
            "2_device_search|f4|16|ds18b20_2_device_search_f446xx_16mhz||f446xx"
            "3_round_robin|f4|16|ds18b20_3_round_robin_f446xx_16mhz||f446xx"
            "4_scan_mode|f4|16|ds18b20_4_scan_mode_f446xx_16mhz||f446xx"
            "5_commands|f4|-|ds18b20_5_commands_f446xx_180mhz||f446xx"
            "6_statistics|f4|-|ds18b20_6_statistics_f446xx_180mhz||f446xx"
            "5_commands|f4|16|ds18b20_5_commands_f446xx_16mhz||f446xx"
            "6_statistics|f4|16|ds18b20_6_statistics_f446xx_16mhz||f446xx"
            "7_low_power|f4|-|ds18b20_7_low_power_lp_f446xx_180mhz|lowpower|f446xx"
          )
          for row in "${matrix[@]}"; do
            IFS='|' read -r app target sysclk out ext chip <<< "$row"
            flags=""
            [ "$target" != "-" ] && flags="$flags OW_TARGET=$target"
            [ "$sysclk" != "-" ] && flags="$flags SYSCLK_MHZ=$sysclk"
            [ "$ext" = "lowpower" ] && flags="$flags EXT=-DOW_PORT_LOW_POWER=1"
            [ -n "$chip" ] && flags="$flags OW_CHIP=$chip"
            echo "::group::build $out (APP=$app OW_TARGET=$target OW_CHIP=${chip:--} SYSCLK_MHZ=$sysclk EXT=$ext)"
            make clean
            make APP=$app $flags
            for e in elf hex bin; do
              cp "build/ds18b20_$app.$e" "dist/$out.$e"
            done
            echo "::endgroup::"
          done

      # Step 7: Stage license and checksums over all variants
      - name: Stage License and Checksums
        run: |
          cp LICENSE dist/LICENSE
          cd dist && sha256sum * > SHA256SUMS.txt

      # Step 10: Publish the release with notes and artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            # stm32-async-1wire

            Non-blocking 1-Wire master for STM32 with a DS18B20 temperature driver
            built on top — bare-metal, register-level.
            1-Wire timing is handled entirely by TIM1 and DMA — no interrupts,
            no software delays, minimal CPU usage. One MCU-independent core and
            six header-only backends (F0/F1/F3/G0/F4/G4) selected at build time with
            `make OW_TARGET=f0` / `make OW_TARGET=f3` / `make OW_TARGET=g0` /
            `make OW_TARGET=f4` / `make OW_TARGET=g4`.

            ## What's new in 2.1.1

            - **LTO is back on F0/G0**: the Cortex-M0/M0+ `-flto` exclusion
              (a GCC 14 thin-LTO link failure) is gone — the firmware links
              cleanly under the pinned Arm GNU Toolchain 15.2, and the F0
              bench matrix (all seven examples at 48MHz and 8MHz,
              parasite-powered) matches the no-LTO reference logs cell for
              cell. On `1_basic` (F030x6 @48MHz) `text` shrinks from 8316 to
              3740 bytes.
            - **CI firmware builds use the pinned 15.2 toolchain**, same as
              the build and release workflows — no more unpinned GCC.

            ## What's new in 2.0.0

            Four breaking changes on the public surface, and the F4 backend that
            makes them worth a major version:

            - **Byte-oriented write API**: `onewire_write_slots()` and
              `onewire_encode_byte()` are replaced by `onewire_write_command()` and
              `onewire_write_command_byte()`. Commands are encoded synchronously into
              an internal pulse buffer and the transfer is scheduled in one call.
            - **Unified parasite knob**: `PARASITE_POWER` and `OW_TIMING_PARASITE` are
              gone, replaced by a single `OW_PARASITE_POWER=0/1` that both widens the
              driver guard band and tells the examples to call
              `ds18b20_set_parasite(1)`.
            - **`STATS_DUMP_INTERVAL` → `STATS_DUMP_SWEEPS`**: the statistics period is
              counted in sweeps (one pass over every device) rather than
              measurements, and is defined once in the example's source instead of
              being forced by both build systems.
            - **`OW_CHIP=f401` → `OW_CHIP=f401xc`**: the part is named by its CMSIS
              flash-density code, and `f401xe` joins it.

            New in this release:

            - **STM32F4 backend** (`port/stm32f4/ow_port_f4.h`), chip-generic across
              the STM32F407VGT6 (F4DISCOVERY, 168MHz) and the STM32F401CC (WeAct F401
              Black Pill, 84MHz off its 25MHz crystal) - the same TIM1/DMA2/`CHSEL=6`
              topology and the same `port/common/ow_port_tim_dma.h` core that the F0,
              F1 and G0 backends now share. All seven examples were run on both
              boards, the F401CC at its 84MHz default.
            - **`HSE_MHZ=N`**: the crystal is a board property, not a part one, so the
              F4 PLL takes its input divider from it instead of assuming 8MHz. A wrong
              value is no longer silent - the waits are bounded and the application says
              so.
            - **Per-part build matrix** in `chips/<part>.mk`, and an unknown
              `OW_TARGET`/`OW_CHIP` is a build error rather than a silent fall-through
              to the F1 default.
            - **No hidden measurement cycles**: the driver starts nothing on its own;
              `ds18b20_start_measure()` is the explicit, one-shot request, and the
              inter-measurement pause left the library.
            - **`inc/ow_config.h`**: one compile-time configuration header.
            - **`config/optim.mk`**, shared by the Makefile and CMake so both build the
              same firmware with the same warning and optimisation flags.

            See `CHANGELOG.md` for the full list; the `1.8.1` section there is
            reconstructed from its commits, since that release shipped without one.

            ## Download

            Each example ships as `.bin` / `.hex` / `.elf` (see `SHA256SUMS.txt`
            for integrity checksums):

            | Target | Clock | Artifact stems |
            |--------|-------|----------------|
            | STM32F103C8T6 | 72MHz (HSE+PLL, default) | `ds18b20_1_basic_72mhz`, …`2_device_search_72mhz`, …`3_round_robin_72mhz`, …`4_scan_mode_72mhz`, `ds18b20_5_commands_72mhz`, `ds18b20_6_statistics_72mhz`, `ds18b20_7_low_power_lp_72mhz` |
            | STM32F103C8T6 | 8MHz HSI (no crystal) | `ds18b20_1_basic_8mhz`, …`2_device_search_8mhz`, …`3_round_robin_8mhz`, …`4_scan_mode_8mhz`, `ds18b20_5_commands_8mhz`, `ds18b20_6_statistics_8mhz` |
            | STM32F030x6 | 48MHz (HSI+PLL, default) | `ds18b20_1_basic_f0_48mhz`, …`2_device_search_f0_48mhz`, …`3_round_robin_f0_48mhz`, …`4_scan_mode_f0_48mhz`, `ds18b20_5_commands_f0_48mhz`, `ds18b20_6_statistics_f0_48mhz`, `ds18b20_7_low_power_lp_f0_48mhz` |
            | STM32G031x6 | 64MHz (HSI16+PLL, default) | `ds18b20_1_basic_g0_64mhz`, …`2_device_search_g0_64mhz`, …`3_round_robin_g0_64mhz`, …`4_scan_mode_g0_64mhz`, `ds18b20_5_commands_g0_64mhz`, `ds18b20_6_statistics_g0_64mhz`, `ds18b20_7_low_power_lp_g0_64mhz` |
            | STM32G031x6 | 16MHz HSI16 (bus on PA12 pad via remap) | `ds18b20_1_basic_g0_16mhz`, …`2_device_search_g0_16mhz`, …`3_round_robin_g0_16mhz`, …`4_scan_mode_g0_16mhz`, `ds18b20_5_commands_g0_16mhz`, `ds18b20_6_statistics_g0_16mhz` |
            | STM32F303VC (F3-DISCOVERY) | 72MHz (HSE+PLL, default) | `ds18b20_1_basic_f3_72mhz`, …`2_device_search_f3_72mhz`, …`3_round_robin_f3_72mhz`, …`4_scan_mode_f3_72mhz`, `ds18b20_5_commands_f3_72mhz`, `ds18b20_6_statistics_f3_72mhz`, `ds18b20_7_low_power_lp_f3_72mhz` |
            | STM32F303VC | 64MHz (HSI/2 + PLL) | `ds18b20_1_basic_f3_64mhz`, …`2_device_search_f3_64mhz`, …`3_round_robin_f3_64mhz`, …`4_scan_mode_f3_64mhz`, `ds18b20_5_commands_f3_64mhz`, `ds18b20_6_statistics_f3_64mhz`, `ds18b20_7_low_power_lp_f3_64mhz` |
            | STM32F303VC | 8MHz raw HSI | `ds18b20_1_basic_f3_8mhz`, …`2_device_search_f3_8mhz`, …`3_round_robin_f3_8mhz`, …`4_scan_mode_f3_8mhz` |
            | STM32G474CB (WeAct) | 170MHz (HSE+PLL) | `ds18b20_1_basic_g4_170mhz`, …`2_device_search_g4_170mhz`, `3_round_robin_g4_170mhz`, `4_scan_mode_g4_170mhz`, `ds18b20_5_commands_g4_170mhz`, `ds18b20_6_statistics_g4_170mhz`, `ds18b20_7_low_power_lp_g4_170mhz` |
            | STM32G474CB (WeAct) | 16MHz HSI16 | `ds18b20_1_basic_g4_16mhz`, …`2_device_search_g4_16mhz`, `3_round_robin_g4_16mhz`, `4_scan_mode_g4_16mhz`, `ds18b20_5_commands_g4_16mhz`, `ds18b20_6_statistics_g4_16mhz`, `ds18b20_7_low_power_lp_g4_16mhz` |
            | STM32F407VGT6 | 16MHz HSI (no crystal) | `ds18b20_1_basic_f407xx_16mhz`, …`2_device_search_f407xx_16mhz` |
            | STM32F401xC (WeAct F401 Black Pill) | 84MHz (25MHz HSE+PLL, default) | `ds18b20_1_basic_f401xc_84mhz`, …`2_device_search_f401xc_84mhz` |
            | STM32F401xC | 16MHz HSI (no crystal) | `ds18b20_1_basic_f401xc_16mhz`, …`2_device_search_f401xc_16mhz` |

            Examples: `1_basic` — single sensor via Skip ROM; `2_device_search` — device
            search + per-device polling (one Convert T per sensor); `3_round_robin` —
            device search + round-robin polling of every sensor; `4_scan_mode` —
            device search + simultaneous multi-device conversion; `5_commands` —
            device search + command transactions (power supply, scratchpad,
            TH/TL, Copy/Recall EEPROM, Read ROM); `6_statistics` — device search +
            signal-statistics dump over UART (`-DOW_STATS_ENABLE=1`); `7_low_power` —
            low-power example (`-DOW_PORT_LOW_POWER=1`) that sleeps in `__WFE()`.

            ## Highlights

            - **True non-blocking 1-Wire**: TIM1 Output Compare + Input Capture with DMA — a hardware state machine does the timing, the CPU just polls a flag
            - **Zero interrupts**: no NVIC IRQs at all
            - **Pure bare-metal C**: register-level, no HAL/LL, arm-none-eabi-gcc
            - **Six MCU backends**: STM32F1 (bus on PA10), STM32F0 (bus on PA10), STM32F3 (bus on PA10), STM32G0 (bus on PA12 via remap), STM32F4 (bus on PA10), STM32G4 (bus on PA10), one shared core
            - **Accuracy**: 0.1 °C resolution, ±0.5 °C typical, one reading every ~0.76 s
            - **CRC-8 validation** on every 9-byte scratchpad read
            - **Weak callbacks** `ds18b20_busy()` / `ds18b20_complete()`
            - **Tooling**: CI (clang-format, cppcheck, GCC -fanalyzer), host test suite for all backends (`make test`, `make test-f0`, `make test-g0`) plus a low-power suite (`make test-lowpower`), VSCode J-Link/ST-Link debug configs

            ## Getting started

