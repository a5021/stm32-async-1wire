            Examples: `1_basic` — single sensor via Skip ROM; `2_device_search` — device
            search + per-device polling (one Convert T per sensor); `3_round_robin` —
            device search + round-robin polling of every sensor; `4_scan_mode` —
            device search + simultaneous multi-device conversion; `5_commands` —
            device search + command transactions (power supply, scratchpad,
            TH/TL, Copy/Recall EEPROM, Read ROM); `6_statistics` — device search +
            signal-statistics dump over UART (`-DOW_STATS_ENABLE=1`); `7_low_power` —
            low-power example (`-DOW_PORT_LOW_POWER=1`) that sleeps in `__WFE()`;
            `8_ds2431` — DS2431 EEPROM: Read/Write/Read/Copy Scratchpad cycle.

            ## Highlights

            - **True non-blocking 1-Wire**: TIM1 Output Compare + Input Capture with DMA — a hardware state machine does the timing, the CPU just polls a flag
            - **Zero interrupts**: no NVIC IRQs at all
            - **Pure bare-metal C**: register-level, no HAL/LL, arm-none-eabi-gcc
            - **Seven MCU backends**: STM32F0 (bus on PA10), STM32F1 (bus on PA10), STM32F3 (bus on PA10), STM32F4 (bus on PA10), STM32G0 (bus on PA12 via remap), STM32G4 (bus on PA10), STM32H5 (bus on PA10), one shared core
            - **Accuracy**: 0.1 °C resolution, ±0.5 °C typical, one reading every ~0.76 s
            - **CRC-8 validation** on every 9-byte scratchpad read
            - **Weak callbacks** `ds18b20_busy()` / `ds18b20_complete()`
            - **Tooling**: CI (clang-format, cppcheck, GCC -fanalyzer), host test suite for all backends (`make test`, `make test-f0`, `make test-g0`) plus a low-power suite (`make test-lowpower`), VSCode J-Link/ST-Link debug configs

            ## Getting started

            See the [README](https://github.com/a5021/stm32-async-1wire#readme):
            include `ds18b20.h`, call `ds18b20_init()` once, then `ds18b20_poll()` in your main loop.

